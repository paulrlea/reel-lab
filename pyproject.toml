[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-lab"
version = "0.1.0"
description = "Local-first Instagram Trial Reel experiment manager"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reel-lab = "reel_lab.cli:main"

[tool.setuptools.packages.find]
include = ["reel_lab*"]
